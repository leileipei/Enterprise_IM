name: Mobile simulator build and scoped checks

# Manual only. Dedicated prepared runner; no physical-device or production secrets.
'on':
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-simulator-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ios-simulator:
    runs-on: [self-hosted, macOS, ARM64, enterprise-im-mobile-isolated]
    timeout-minutes: 45
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: im-mobile-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          set-safe-directory: false
          clean: false
      - name: Build owned simulator copy and run scoped checks
        shell: bash
        working-directory: im-mobile-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -eu
          : "${IM_FLUTTER_SDK:?Prepared fixed SDK required}"
          : "${IM_FLUTTER_PUB_CACHE:?Prepared locked cache required}"
          python3 scripts/build-client-mobile.py \
            --flutter-sdk "$IM_FLUTTER_SDK" \
            --pub-cache "$IM_FLUTTER_PUB_CACHE" \
            --output "$PWD/mobile-artifacts" \
            --verify-simulator \
            --simulator-runtime com.apple.CoreSimulator.SimRuntime.iOS-27-0 \
            --simulator-device-type com.apple.CoreSimulator.SimDeviceType.iPhone-18-Pro
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ios-simulator-scoped-${{ github.sha }}
          path: im-mobile-${{ github.run_id }}-${{ github.run_attempt }}/mobile-artifacts/
          retention-days: 7
          if-no-files-found: error
