analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - windows/**
    - macos/**
    - ios/**
linter:
  rules:
    - avoid_print
    - unawaited_futures
    - cancel_subscriptions
    - close_sinks
    - use_build_context_synchronously
