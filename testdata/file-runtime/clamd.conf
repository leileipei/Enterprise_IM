# Task 8 must bind and attest this configuration before scanner enablement.
LocalSocket /runtime/clamd.sock
FixStaleSocket yes
Foreground yes
DatabaseDirectory /var/lib/clamav
StreamMaxLength 26214400
MaxFileSize 26214400
MaxScanSize 262144000
MaxRecursion 16
MaxFiles 10000
AlertExceedsMax yes
AlertEncrypted yes
AlertBrokenExecutables yes
