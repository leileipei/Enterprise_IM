# Dedicated fixtures only. Supply a private 0600 env file; never commit credentials.
name: enterprise-im-file-runtime
services:
  postgres:
    image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: enterprise_im_files
      POSTGRES_USER: im_files
      POSTGRES_PASSWORD: ${IM_TEST_PG_PASSWORD:?private password required}
    ports: ["127.0.0.1::5432"]
  s3:
    image: minio/minio@sha256:ac591851803a79aee64bc37f66d77c56b0a4b6e12d9e5356380f4105510f2332
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${IM_FILE_S3_ACCESS_KEY:?private key required}
      MINIO_ROOT_PASSWORD: ${IM_FILE_S3_SECRET_KEY:?private secret required}
    ports: ["127.0.0.1::9000"]
